name: Build and publish Windows packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to, e.g. v0.1.2"
        required: true
      ref:
        description: "Git ref to build (branch/tag/commit)"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Resolve build ref
        id: build_ref
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            "ref=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
            "tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "ref=${{ inputs.ref }}" >> $env:GITHUB_OUTPUT
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build_ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable and ZIP packages
        run: npm run dist

      - name: Verify packaged application branding
        run: node scripts/check-packaged-branding.cjs --release

      - name: Verify real Windows taskbar icons and relaunch properties
        run: npm run test:branding-smoke -- --release

      - name: Resolve package names
        id: package_info
        env:
          RELEASE_TAG: ${{ steps.build_ref.outputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$version" -and $tag -ne $version) {
            throw "Release tag $tag does not match package version $version"
          }
          # 发布包不带版本号：解压工具按包名建目录，目录名才不会每升一个版本就变一次
          $portable = Join-Path "release" "DevKit-portable.exe"
          $zip = Join-Path "release" "DevKit-win-x64.zip"

          if (-not (Test-Path $portable)) {
            throw "Portable package was not generated: $portable"
          }
          if (-not (Test-Path $zip)) {
            throw "ZIP package was not generated: $zip"
          }

          # 生成 .sha256 边车：应用内更新在 GitHub API 限流时走发布直链回退通道，靠它校验完整性
          foreach ($file in @($portable, $zip)) {
            $digest = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            [System.IO.File]::WriteAllText("$file.sha256", $digest, [System.Text.UTF8Encoding]::new($false))
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload Windows packages to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.build_ref.outputs.tag }}" `
            "${{ steps.package_info.outputs.portable }}" `
            "${{ steps.package_info.outputs.portable }}.sha256" `
            "${{ steps.package_info.outputs.zip }}" `
            "${{ steps.package_info.outputs.zip }}.sha256" `
            --clobber

      - name: Update Release download notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.build_ref.outputs.tag }}"
          $body = gh release view "$tag" --json body --jq .body
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $body, [System.Text.UTF8Encoding]::new($false))
          node scripts/update-release-download-table.cjs "$notesFile"
          gh release edit "$tag" --notes-file "$notesFile"
