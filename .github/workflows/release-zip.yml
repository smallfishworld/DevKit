name: Build and upload Windows ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to"
        required: true
        default: "v0.1.1"
      ref:
        description: "Git ref to build"
        required: true
        default: "main"
  # Bootstrap the workflow for the current v0.1.1 release when this file changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-zip.yml"

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows ZIP package
        run: npm run dist:zip

      - name: Resolve release info
        id: release_info
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } elseif ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } else {
            $tag = "v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload ZIP to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path release -Filter "DevKit-*-win-x64.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Windows ZIP package was not generated."
          }
          gh release upload "${{ steps.release_info.outputs.tag }}" "$($zip.FullName)" --clobber

      - name: Update Release download notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $version = "${{ steps.release_info.outputs.version }}"
          $zipName = "DevKit-$version-win-x64.zip"
          $body = gh release view "$tag" --json body --jq .body

          if ($body -notmatch [regex]::Escape($zipName)) {
            $portableName = "DevKit-$version-portable.exe"
            $zipRow = "| $zipName | Windows x64 解压版，解压后运行 DevKit.exe，推荐长期使用 |"
            $lines = $body -split "`r?`n"
            $result = New-Object System.Collections.Generic.List[string]
            $inserted = $false

            foreach ($line in $lines) {
              $result.Add($line)
              if (-not $inserted -and $line.Contains($portableName) -and $line.TrimStart().StartsWith("|")) {
                $result.Add($zipRow)
                $inserted = $true
              }
            }

            if (-not $inserted) {
              $result.Add("")
              $result.Add("## ZIP 解压版")
              $result.Add("")
              $result.Add("- ``$zipName``：Windows x64 解压版，解压后运行 ``DevKit.exe``，推荐长期使用。")
            }

            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
            [System.IO.File]::WriteAllText($notesFile, ($result -join "`n"), [System.Text.UTF8Encoding]::new($false))
            gh release edit "$tag" --notes-file "$notesFile"
          }
