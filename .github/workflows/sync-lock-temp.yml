name: Sync package lock (temporary)

on:
  push:
    branches:
      - feat/local-terminal-20260923

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-terminal-20260923

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        shell: pwsh
        run: |
          if (git diff --quiet -- package-lock.json) {
            Write-Host 'package-lock.json is already in sync'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync package lock for node-pty'
          git push origin HEAD:feat/local-terminal-20260923
