name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: node-pty runtime smoke test
        run: npm run test:pty-smoke

      - name: Build unpacked Windows app
        run: npm run dist:dir

      - name: Verify packaged node-pty
        shell: pwsh
        run: |
          $env:DEVKIT_CHECK_PACKAGED = '1'
          npm run test:pty-smoke
