name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify generated brand icon assets
        run: npm run icons:check

      - name: Build
        run: npm run build

      - name: App update flow in the workbench
        run: npm run test:updates-smoke

      - name: Device plugin Electron integration smoke
        run: npm run test:plugins-smoke

      - name: Official HTTPS plugin source and serial binding smoke
        env:
          DEVKIT_OFFICIAL_SOURCE_SMOKE: '1'
        run: npm run test:extensions-smoke

      - name: node-pty runtime smoke test
        run: npm run test:pty-smoke

      - name: Build Windows portable and ZIP packages
        run: npm run dist

      - name: Verify packaged application branding
        run: node scripts/check-packaged-branding.cjs --release

      - name: Verify real Windows taskbar icons and relaunch properties
        run: npm run test:branding-smoke -- --release

      - name: Verify packaged node-pty
        shell: pwsh
        run: |
          $env:DEVKIT_CHECK_PACKAGED = '1'
          npm run test:pty-smoke

      - name: Verify portable and ZIP restart updates on Windows
        shell: pwsh
        run: |
          $current = [version](Get-Content package.json | ConvertFrom-Json).version
          $next = "$($current.Major).$($current.Minor).$($current.Build + 1)"
          npm exec -- electron-builder --win --config.compression=store --config.extraMetadata.version=$next --config.directories.output=release-update-next
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/probes/windows-updates.cjs "$next" release-update-next

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: DevKit-Windows-${{ github.sha }}
          path: |
            release/DevKit-*-portable.exe
            release/DevKit-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7
